{% extends "base.html" %}

{% block title %}Create an Account{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>Create account</h1>
    <p class="muted">Register with your campus details to access placement and internship drives.</p>

    <form class="form" method="post" action="{{ url_for('register') }}">
      <div class="field">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" autocomplete="name"
               value="{{ name or '' }}" placeholder="e.g. Aditi Sharma" required autofocus>
      </div>

      <div class="field">
        <label for="email">Campus Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               value="{{ email or '' }}" placeholder="you@campus.edu" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password"
               autocomplete="new-password" placeholder="Repeat your password" minlength="6" required>
      </div>

      <div class="field">
        <label for="role">Account Role</label>
        <select id="role" name="role" class="select-input">
          <option value="student" selected>Student / Candidate</option>
          <option value="admin">Campus Placement Admin</option>
        </select>
      </div>

      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>

    <div class="auth-switch">
      <p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in here</a></p>
    </div>
  </div>
</section>
{% endblock %}
