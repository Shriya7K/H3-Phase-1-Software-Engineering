{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>Sign in</h1>
    <p class="muted">Use your campus account to browse opportunities and aptitude tests.</p>

    <form class="form" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username"
               value="{{ email or '' }}" placeholder="you@campus.edu" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="Your password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>

    <div class="auth-switch">
      <p class="muted">Don't have an account? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>

    <div class="demo-box">
      <p class="demo-title">Demo accounts</p>
      <code>student@campus.edu / student123</code>
      <code>admin@campus.edu / admin123</code>
    </div>
  </div>
</section>
{% endblock %}
